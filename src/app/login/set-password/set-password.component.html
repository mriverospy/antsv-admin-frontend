<div class="set-password-page-container flex justify-content-center align-items-center min-h-screen p-4">
    <div class="card p-5 shadow-6 w-full lg:w-4 md:w-6">

        <h2 class="text-2xl text-center mb-4">
            <i class="pi pi-lock text-primary mr-2"></i>
            Establecer Contraseña
        </h2>
        <p class="text-center text-color-secondary mb-4">
            Ingresa tu nueva contraseña para activar tu cuenta.
        </p>

        <div *ngIf="errorMessage && !loading" class="mb-3">
            <p-message severity="error" [text]="errorMessage" styleClass="w-full"></p-message>
        </div>

        <div *ngIf="successMessage" class="mb-3">
            <p-message severity="success" [text]="successMessage" styleClass="w-full"></p-message>
        </div>

        <div *ngIf="!token && !loading" class="mb-3 text-center">
            <p-message severity="warn" text="Token de verificación no encontrado o inválido."></p-message>
        </div>

        <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()" *ngIf="token && !successMessage">

            <div class="field mb-4">
                <label for="newPassword" class="block mb-2">
                    Nueva Contraseña <span class="text-red-500">*</span>
                </label>
                <p-password
                        id="newPassword"
                        formControlName="newPassword"
                        placeholder="Contraseña (mínimo 8 caracteres)"
                        [toggleMask]="true"
                        [feedback]="false"
                        class="w-full"
                        required>
                </p-password>

                <small class="p-error block mt-1" *ngIf="newPassword?.invalid && (newPassword?.dirty || newPassword?.touched)">
                    <span *ngIf="newPassword?.errors?.['required']">
                        La nueva contraseña es obligatoria.
                    </span>
                    <span *ngIf="newPassword?.errors?.['minlength']">
                        Debe tener al menos 8 caracteres.
                    </span>
                </small>
            </div>

            <div class="field mb-5">
                <label for="confirmPassword" class="block mb-2">
                    Repetir Contraseña <span class="text-red-500">*</span>
                </label>
                <p-password
                        id="confirmPassword"
                        formControlName="confirmPassword"
                        placeholder="Repita la contraseña"
                        [toggleMask]="true"
                        [feedback]="false"
                        class="w-full"
                        required>
                </p-password>

                <small class="p-error block mt-1"
                       *ngIf="confirmPassword?.invalid && (confirmPassword?.dirty || confirmPassword?.touched) || passwordForm.errors?.['mismatch']">
                    <span *ngIf="confirmPassword?.errors?.['required']">
                        Debe repetir la contraseña.
                    </span>
                    <span *ngIf="passwordForm.errors?.['mismatch'] && confirmPassword?.valid">
                        Las contraseñas no coinciden.
                    </span>
                </small>
            </div>

            <div class="flex justify-content-center">
                <p-button
                        label="Establecer y Activar"
                        severity="primary"
                        icon="pi pi-check"
                        type="submit"
                        [loading]="loading"
                        [disabled]="passwordForm.invalid || loading">
                </p-button>
            </div>

        </form>
    </div>
</div>
